name: "CI"
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  VITE_CSOUND_FLOSS_VERSION: 8.1.1
  LANGUAGES: "en fr fa"
on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@31.11.3
        env:
          # Nix build users are system users; keep their UIDs in that range.
          NIX_FIRST_BUILD_UID: "800"
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/d3b13ad75cc492690728f9307e443dec9ef9a20e.tar.gz
      - uses: cachix/cachix-action@v17
        with:
          name: csound-flossmanual
          signingKey: "${{ secrets.CACHIX_SIGNING_KEY }}"
      - name: Install build dependencies from cache
        run: |
          nix-env -i -f shell.nix
          mkdir -p $HOME/.local/share/fonts
          cp -rf $(nix-build --no-out-link '<nixpkgs>' -A fira)/share/fonts/* \
            $HOME/.local/share/fonts
          fc-cache -f -v
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Install npm dependencies
        run: npm ci
      - name: Test
        run: npm run test:ci
      - name: Build the book website
        run: npm run build
      - name: Build multi-language documents
        run: |
          mkdir -p build/build
          for lang in $LANGUAGES; do
            echo "Building $lang documents..."

            # Build PDF
            LANG=$lang npm run build:pdf
            mv csound-flossmanual-${lang}.pdf build/build/csound-flossmanual-${lang}-${VITE_CSOUND_FLOSS_VERSION}.pdf

            # Build EPUB
            LANG=$lang npm run build:epub
            mv csound-flossmanual-${lang}.epub build/build/csound-flossmanual-${lang}-${VITE_CSOUND_FLOSS_VERSION}.epub

            # Build ODT
            LANG=$lang npm run build:odt
            mv csound-flossmanual-${lang}.odt build/build/csound-flossmanual-${lang}-${VITE_CSOUND_FLOSS_VERSION}.odt
          done
      - name: Compress dist to zip
        run: |
          nix-env -f '<nixpkgs>' -iA zip
          zip -r dist.zip build
      - name: Archive Production Artifact
        uses: actions/upload-artifact@master
        with:
          name: dist
          path: dist.zip
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
      - name: Download Artifact
        uses: actions/download-artifact@master
        with:
          name: dist
      - name: Uncompress dist archive
        run: |
          sudo apt-get install unzip
          unzip ./dist.zip
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy -P default --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
